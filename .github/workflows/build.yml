name: Build StabShot 1.21.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. v0.1)"
        required: true
        default: "v0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build mod
        working-directory: stabshot
        run: gradle build --no-daemon --no-build-cache

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: "Vulgar's OSC ${{ github.event.inputs.version }} (1.21.1)"
          path: stabshot/build/libs/stabshot-*.jar
          if-no-files-found: error
