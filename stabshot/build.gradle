plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations {
    // 'embed' jars get unpacked into our output jar AND are on the compile classpath.
    // We need this because Loom's include() does not work for JitPack artifacts.
    embed
    implementation.extendsFrom embed
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — pure-Java MP3 decoder. On mavenCentral so include() works fine.
    include(implementation('javazoom:jlayer:1.0.1'))

    // LWJGL — already present at runtime via Minecraft. compileOnly so we never bundle it.
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-stb:3.3.3"

    // NewPipe Extractor.
    // Exact JitPack coordinates (confirmed from https://jitpack.io/p/teamnewpipe/newpipeextractor):
    //   groupId:    com.github.teamnewpipe
    //   artifactId: newpipeextractor   (all lowercase)
    //   version:    v0.26.3            (latest stable)
    // NewPipe bundles Rhino, Gson, and jsoup inside its own jar, so no extra deps needed.
    embed('com.github.teamnewpipe:newpipeextractor:v0.26.3')
}

jar {
    // Unpack every jar in 'embed' and merge into our output jar.
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Strip any LWJGL classes that might have come in transitively — they would
    // shadow Minecraft's own native binaries and cause NoSuchMethodError crashes.
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    exclude '*.so'
    exclude '*.dll'
    exclude '*.dylib'

    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release  = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
