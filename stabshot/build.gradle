plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations {
    // Libraries we want to bundle into the output jar without pulling their
    // transitive dependencies (which might conflict with Minecraft's own libs).
    bundleOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ── Audio ──────────────────────────────────────────────────────────────────
    // JLayer — pure-Java MP3 frame decoder. Works on desktop and Android JRE.
    // Minecraft does NOT ship JLayer, so we must bundle it.
    include(implementation('javazoom:jlayer:1.0.1'))

    // LWJGL (OpenAL + STB Vorbis) — already present at runtime via Minecraft;
    // declared here only for compilation so the compiler can resolve the classes.
    // 'compileOnly' ensures nothing gets added to the bundled jar or classpath
    // at runtime (Minecraft provides the real native libs).
    // We reference the LWJGL BOM so the version matches what MC 1.21.1 ships.
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-stb:3.3.3"

    // ── YouTube extraction ─────────────────────────────────────────────────────
    // NewPipe Extractor — full dependency graph for compilation (so transitive
    // deps like Gson are on the compile classpath), but we only bundle the main
    // jar without its transitives.  Gson and other transitive libs are provided
    // by Minecraft's own classpath at runtime.
    implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8')
    bundleOnly('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8') {
        transitive = false
    }
}

// ── Jar bundling ───────────────────────────────────────────────────────────────
// Bundle only the NewPipe jar itself (no transitives) and JLayer (handled by
// `include` above).  We explicitly exclude any LWJGL or STB classes that might
// have leaked in so we never shadow Minecraft's own native LWJGL binaries.
jar {
    from {
        configurations.bundleOnly.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Hard exclude any LWJGL/native classes that might have crept in transitively.
    // This prevents "NoSuchMethodError" crashes caused by shadowing Minecraft's LWJGL.
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    exclude '*.so'
    exclude '*.dll'
    exclude '*.dylib'

    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release  = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
