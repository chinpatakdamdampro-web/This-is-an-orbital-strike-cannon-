plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — pure-Java MP3 decoder. Bundled via include() so Loom
    // correctly includes it in the final remapped jar.
    include(implementation('javazoom:jlayer:1.0.1'))

    // LWJGL OpenAL + STBVorbis — provided at runtime by Minecraft's own
    // LWJGL bundle. compileOnly so they resolve at compile time but are
    // never packaged into our jar (which would shadow MC's natives).
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-stb:3.3.3"

    // NewPipe Extractor + its required transitive dependencies.
    // We use include() for each so Fabric Loom correctly embeds them into
    // the remapped output jar. transitive=false on each because we list
    // only what NewPipe actually needs at runtime and nothing that would
    // conflict with Minecraft (no OkHttp, no LWJGL, etc).
    //
    // Required at runtime by NewPipe Extractor v0.24.8:
    //   - newpipe-extractor itself
    //   - rhino-engine  (JavaScript engine for YouTube cipher decryption)
    //   - gson          (JSON parsing)
    //   - jsoup         (HTML parsing for fallback extraction)
    include(implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8') { transitive = false })
    include(implementation('org.mozilla:rhino-engine:1.7.15')                 { transitive = false })
    include(implementation('com.google.code.gson:gson:2.10.1')                { transitive = false })
    include(implementation('org.jsoup:jsoup:1.17.2')                         { transitive = false })
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Never let any LWJGL classes slip into our jar — they would shadow
    // Minecraft's own natives and cause NoSuchMethodError crashes.
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    exclude '*.so'
    exclude '*.dll'
    exclude '*.dylib'

    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release  = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
