plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations {
    // Deps to embed into the output jar manually via the jar task.
    // We cannot use Loom's include() for JitPack artifacts.
    embed
    // embed extends implementation so javac sees the classes too.
    implementation.extendsFrom embed
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — pure-Java MP3 decoder.
    // include() works fine here because it is on mavenCentral.
    include(implementation('javazoom:jlayer:1.0.1'))

    // LWJGL — provided at runtime by Minecraft, compileOnly so never bundled.
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-stb:3.3.3"

    // NewPipe Extractor from JitPack.
    // Note: JitPack group ID must be lowercase: com.github.teamnewpipe
    // We use the 'embed' configuration so these classes are added to
    // the jar task output below AND are on the compile classpath.
    // transitive=false on NewPipe itself to avoid pulling in okhttp etc;
    // we explicitly list only what is actually needed at runtime.
    embed('com.github.teamnewpipe:NewPipeExtractor:v0.24.8') { transitive = false }

    // NewPipe's mandatory runtime deps (all on mavenCentral, safe to use include()):
    include(embed('com.google.code.gson:gson:2.10.1')  { transitive = false })
    include(embed('org.jsoup:jsoup:1.17.2')            { transitive = false })
    include(embed('org.mozilla:rhino-engine:1.7.15')   { transitive = false })
}

jar {
    // Unpack every jar in the 'embed' config and merge its classes into ours.
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Never include LWJGL — it would shadow Minecraft's own native binaries.
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    exclude '*.so'
    exclude '*.dll'
    exclude '*.dylib'

    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release  = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
