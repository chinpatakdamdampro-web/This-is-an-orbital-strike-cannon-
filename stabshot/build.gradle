plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — pure-Java MP3 decoder.
    include(implementation('javazoom:jlayer:1.0.1'))

    // LWJGL OpenAL + STBVorbis — provided at runtime by Minecraft.
    // compileOnly so they resolve at compile time but are never packaged.
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-stb:3.3.3"

    // NewPipe Extractor + required runtime dependencies.
    // Each needs BOTH implementation() (compile classpath) AND include() (bundled into jar).
    // include() alone does NOT put classes on the compile classpath in Fabric Loom.
    // transitive=false on each — we only bundle what NewPipe actually needs at runtime.
    //
    //   newpipe-extractor — core extraction logic
    //   rhino-engine      — JS engine for YouTube cipher decryption (required at runtime)
    //   gson              — JSON parsing used internally by NewPipe
    //   jsoup             — HTML parsing used internally by NewPipe
    implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8') { transitive = false }
    include('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8')        { transitive = false }

    implementation('org.mozilla:rhino-engine:1.7.15') { transitive = false }
    include('org.mozilla:rhino-engine:1.7.15')        { transitive = false }

    implementation('com.google.code.gson:gson:2.10.1') { transitive = false }
    include('com.google.code.gson:gson:2.10.1')        { transitive = false }

    implementation('org.jsoup:jsoup:1.17.2') { transitive = false }
    include('org.jsoup:jsoup:1.17.2')        { transitive = false }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Never let LWJGL classes into our jar — they shadow MC's natives.
    exclude 'org/lwjgl/**'
    exclude 'natives/**'
    exclude '*.so'
    exclude '*.dll'
    exclude '*.dylib'

    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release  = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
