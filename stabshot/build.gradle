plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations {
    shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — MP3 decoding for ThemeSongPlayer and YouTube streaming
    shade('javazoom:jlayer:1.0.1')
    implementation('javazoom:jlayer:1.0.1')

    // NewPipe Extractor — gets direct audio stream URLs from YouTube (no API key)
    shade('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8')
    implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8')
}

// Bundle shaded deps into the jar
jar {
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
