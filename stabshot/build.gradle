plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JLayer — MP3 decoding
    include(implementation('javazoom:jlayer:1.0.1'))

    // NewPipe Extractor + all its required runtime dependencies
    // Each one needs to be included separately so Fabric Loader bundles them
    include(implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.24.8') {
        transitive = false
    })

    // NewPipe runtime deps — required or YouTube extraction will crash
    include(implementation('org.jsoup:jsoup:1.17.2'))              // HTML parsing
    include(implementation('org.mozilla:rhino:1.7.15'))             // JS engine (YouTube sig decoding)
    include(implementation('com.squareup.okhttp3:okhttp:4.12.0'))  // HTTP (NewPipe uses this internally)
    include(implementation('com.squareup.okio:okio:3.6.0'))        // Required by OkHttp
    include(implementation('com.google.code.gson:gson:2.10.1'))     // JSON parsing
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
